global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:9090

  - job_name: chatme-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080
