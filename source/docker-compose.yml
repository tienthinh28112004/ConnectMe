#Lệnh chạy lại docker compose up -d --build
services:
  backend:
    build: ./server/WeChat        
    container_name: backend
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CENTRIFUGO_JWT_SECRET: ${CENTRIFUGO_JWT_SECRET}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_API_URL: ${CENTRIFUGO_API_URL}
    restart: unless-stopped

  frontend:
    build: ./client/chatme
    container_name: frontend
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    restart: unless-stopped
    volumes:
      - ./client/chatme:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID}
      REACT_APP_GOOGLE_REDIRECT_URI: ${REACT_APP_GOOGLE_REDIRECT_URI}
      REACT_APP_GOOGLE_AUTH_URI: ${REACT_APP_GOOGLE_AUTH_URI}
    command: ["npm", "start"]

  centrifugo:
    image: centrifugo/centrifugo-pro:v6.4.0
    container_name: centrifugo
    command: ["centrifugo", "-c", "/centrifugo/config.json"]
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_JWT_SECRET}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_ADMIN_PASSWORD: ${CENTRIFUGO_ADMIN_PASSWORD}
      CENTRIFUGO_ADMIN_SECRET: ${CENTRIFUGO_ADMIN_SECRET}
    restart: unless-stopped
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "8000:8000"

  nginx:
    image: nginx:1.25
    container_name: nginx
    restart: unless-stopped
    ports:
      - "9000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  redis:
    image: redis:8.0-M03-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"                       # mở cổng ra ngoài để bạn còn connect từ DBeaver / MySQL Workbench
    command:
      [
        "mysqld",
        "--server-id=1",
        "--log_bin=mysql-bin",
        "--binlog_format=ROW",
        "--binlog_row_image=FULL"
      ]
    volumes:
      - mysql-data:/var/lib/mysql         # lưu data MySQL ra volume
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  kafka:
    image: bitnamilegacy/kafka:3.7.0   #Hỗ trợ Kraft(Không cần ZooKeeper)
    container_name: kafka        #Tên container
    hostname: kafka              #Hostname để container khác gọi bằng kafka
    ports:
      - "9094:9094"        # dùng cổng này để debug từ máy host
    environment:
      - KAFKA_CFG_NODE_ID=0       #Id của node Kafka trong cluster (node 0)
      - KAFKA_CFG_PROCESS_ROLES=controller,broker       #Node này vừa làm controller(quản lý metadata) vừa làm broker(xử lý message)
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093      #Chỉ định danh sách controller quorum (1 node: id=0, host=kafka, port = 9093)
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094    
            #PLAINTEXT-9092: cho docker internal (connect,centrifugo,...)
            #CONTROLLER-9093: cho controller nội bộ KRaft
            #EXTERNAL-9094: để máy thật truy cập qua 9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094  
            #Kafka quảng cáo đại chỉ
            #-PLAINTEXT cho container khác --> kafka:9092
            #-EXTERNAL cho máy host -->localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT   #Tất cả listener dùng giao thức PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER #Listener nào dùng cho controller (CONTROLLER://:9093)
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true   #Tự tạo topic nếu producer/consumer sử dụng topic chưa tồn tại (tiện cho dev)
    volumes:
      - kafka-data:/tmp/kraft-combined-logs    #Volume để Kafka lưu metadata + logs,tránh mất dữ liệu khi restart
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  connect:          #Service Kafka connect
    image: quay.io/debezium/connect:2.5     #Image connect đã tích hợp debezium
    container_name: connect            #Tên container
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "8083:8083"  # Kafka Connect REST API (dùng để tạo connector)
    environment:
      BOOTSTRAP_SERVERS: kafka:9092  #Kafka broker để kết nối (Listener PLAINTEXT nội bộ)
      GROUP_ID: 1       #ID cho cluster connect (1 node nên cứ để 1) 
      CONFIG_STORAGE_TOPIC: connect_configs      #Topic để lưu confid connector
      OFFSET_STORAGE_TOPIC: connect_offsets      #Topic lưu offset binlog đã đọc tới đâu của Debezium
      STATUS_STORAGE_TOPIC: connect_statuses     #Topic lưu trạng thái connector (running,failed)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CONNECT_CONFIG_PROVIDERS: envvar
      CONNECT_CONFIG_PROVIDERS_ENVVAR_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  
  connect-config-loader:   #Container phụ chỉ chạy 1 lần để nạp Debezium
    image: curlimages/curl:8.8.0         #Image nhẹ chỉ chưa curl để gọi REST API
    container_name: connect-config-loader
    depends_on:
      connect:
        condition: service_healthy
    volumes:
      - ./debezium/debezium-config.json:/debezium-config.json #Mount file config Debezium từ máy bạn vào container
    entrypoint: >  #Đợi Kafka connect chạy xong,xóa connector cũ nếu tồn tại,tạo connector mới bằng file Debezium,kết thúc nhiệm vụ và container tắt
      sh -c "
        set -e;
        echo 'Waiting for Kafka Connect to start...';    
        until curl -sf http://connect:8083/connectors; do sleep 2; done;
        echo 'Kafka Connect is up, posting Debezium connector config...';
        # xoá connector cũ nếu có
        curl -s -X DELETE http://connect:8083/connectors/chatme-mysql-connector || true;
        # tạo mới
        curl --fail-with-body -s -X POST -H 'Content-Type: application/json' --data @/debezium-config.json http://connect:8083/connectors;
        echo 'Debezium connector configured.';
      "

  prometheus:
    image: prom/prometheus:v2.42.0
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:
  kafka-data:           # Kafka dùng để lưu logs KRaft
    driver: local
  redis-data:           # để Redis mount vào /data (thay vì cache)
    driver: local
  mysql-data:           # để MySQL lưu data
    driver: local
