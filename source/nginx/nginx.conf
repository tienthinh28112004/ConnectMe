user www-data;                         
worker_processes auto;                 
pid /run/nginx.pid;                    
include /etc/nginx/modules-enabled/*.conf;

events {
  worker_connections 1024;             
}

http {

  upstream backend {
    server backend:8080;               # chạy backend port 8080
  }

  upstream frontend {
    server frontend:3000;              # ReactJS chạy port 3000
  }

  upstream centrifugo {
    server centrifugo:8000;            # Centrifugo realtime server ở port 8000
  }

  #cấu hình Server chính nginx listen port 80
  server {
    listen 80;                         # Nginx lắng nghe port 80 (được map ra ngoài qua port 9000 trong Docker)
    server_name localhost 127.0.0.1;   # tên miền hoặc địa chỉ host mà Nginx phục vụ

    #Kết nối realtime websocket (centrifugo)
     location /connection/websocket {
       proxy_pass          http://centrifugo;      
       proxy_http_version  1.1;                    
       proxy_redirect      default;

       proxy_set_header    Upgrade $http_upgrade;  
       proxy_set_header    Connection "upgrade";
       proxy_set_header    Host $host;
       proxy_set_header    X-Real-IP $remote_addr;           
       proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for; 
       proxy_set_header    X-Forwarded-Host $server_name;
     }

    #Api backend
    location /api {
      proxy_pass          http://backend;         
      proxy_http_version  1.1;
      proxy_redirect      default;

      proxy_set_header    Upgrade $http_upgrade;
      proxy_set_header    Connection "upgrade";
      proxy_set_header    Host $host;
      proxy_set_header    X-Real-IP $remote_addr;
      proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header    X-Forwarded-Host $server_name;
    }

    # /admin
    location /admin {
      proxy_pass          http://backend;         
      proxy_http_version  1.1;
      proxy_redirect      default;

      proxy_set_header    Upgrade $http_upgrade;
      proxy_set_header    Connection "upgrade";
      proxy_set_header    Host $host;
      proxy_set_header    X-Real-IP $remote_addr;
      proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header    X-Forwarded-Host $server_name;
    }

    #/static phục vụ các file tĩnh (nếu có)
    location /static {
      proxy_pass          http://backend;       
      proxy_set_header    Host $host;
      proxy_http_version  1.1;
      proxy_redirect      default;
    }

    #Đường dẫn khác không thuộc /api (fontend)
    location / {
      proxy_pass          http://frontend;      
      proxy_http_version  1.1;
      proxy_redirect      default;

      proxy_set_header    Upgrade $http_upgrade;
      proxy_set_header    Connection "upgrade";
      proxy_set_header    Host $host;
      proxy_set_header    X-Real-IP $remote_addr;
      proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header    X-Forwarded-Host $server_name;
    }
  }
}
