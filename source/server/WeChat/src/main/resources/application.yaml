server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: chatme-backend

  datasource:
    # Mặc định chạy LOCAL: dùng localhost
    # Khi chạy trong Docker: sẽ bị override bằng biến môi trường SPRING_DATASOURCE_URL
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ChatMe}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}

  servlet:
    multipart:
      enabled: true
      max-file-size: 2000MB
      max-request-size: 2000MB
      file-size-threshold: 2KB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  data:
    redis:
      # LOCAL: dùng localhost:6379
      # Docker: sẽ override bằng SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:3000/oauth2/callback/google}
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

centrifugo:
  jwt-secret: ${CENTRIFUGO_JWT_SECRET}
  api-key: ${CENTRIFUGO_API_KEY}
  # LOCAL: gọi http://localhost:8000
  # Docker: override bằng CENTRIFUGO_API_URL => http://centrifugo:8000
  api-url: ${CENTRIFUGO_API_URL:http://localhost:8000}

app:
  secret: ${APP_JWT_SECRET}
  jwt:
    token:
      expires-in: 3600000   # 60 minutes in milliseconds
    refresh-token:
      expires-in: 86400000  # 24 hours in milliseconds
  registration:
    email:
      token:
        expires-in: 300000  # 5 phút

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
